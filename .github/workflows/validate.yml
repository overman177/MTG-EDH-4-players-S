name: Validate MTG EDH scripts
on:
  push:
    branches: [main, "architecture/**", "feature/**", "fix/**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Windows updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("tools/update-and-deploy.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Verify shared one-way updater and no-backup deploy
        run: python tests/update_workflow_test.py
      - name: Test new TTS object registration and conflict protection
        run: python tests/register_new_objects_test.py
      - name: Validate GUID inventory
        run: python tools/audit_objects.py .
      - name: Reject unclassified Smart Import scripts in Git
        run: |
          if git ls-files New | grep -E '^New/.*\.(lua|xml)$'; then
            echo "Move or discard unclassified New/ scripts before committing." >&2
            exit 1
          fi
      - name: Verify lossless source assembly
        run: python tools/build.py --check
      - name: Check Lua 5.2 syntax of assembled scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.2
          luac5.2 -p .build/Global.lua
          luac5.2 -p .build/LotusHelper.lua
      - name: Test Ring ornament and animated startup banner
        run: lua5.2 tests/ring_startup_test.lua
      - name: Test preview pipeline and asset cache
        run: lua5.2 tests/preview_pipeline_test.lua
      - name: Test independent four-seat counter visibility
        run: lua5.2 tests/counter_visibility_test.lua
      - name: Test Draw Random during transient deck merges
        run: lua5.2 tests/draw_random_lifecycle_test.lua
      - name: Test Reveal Top during library deck merges
        run: lua5.2 tests/reveal_top_deck_merge_test.lua
      - name: Test Lotus callbacks after deck-object invalidation
        run: lua5.2 tests/lotus_lifecycle_guard_test.lua
      - name: Test report validation and local cooldown
        run: lua5.2 tests/bug_report_security_test.lua
      - name: Test per-seat combat hold settings and General tab
        run: lua5.2 tests/combat_settings_test.lua
      - name: Test combat targeting interactions
        run: lua5.2 tests/combat_hotkey_test.lua
      - name: Test Lotus keybind menu routing
        run: lua5.2 tests/lotus_hotkey_config_test.lua
      - name: Test multi-defender arrows, legacy cleanup and no FIGHT UI
        run: lua5.2 tests/combat_arrows_test.lua
